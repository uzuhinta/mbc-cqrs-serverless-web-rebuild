name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.react == '18'
        run: pnpm use-react 18
      - run: pnpm verify
  next-smoke:
    name: next-smoke (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.react == '18'
        run: pnpm use-react 18
      - run: pnpm build
      - run: pnpm smoke
      # The Pages Router renders with the app's React, so it shows the matrix version.
      - name: assert the Pages Router rendered React ${{ matrix.react }}
        run: grep -q "react ${{ matrix.react }}\." apps/next-smoke/.next/server/pages/legacy.html
      - name: assert master-web rendered on that React, and its server values
        run: |
          grep -q "JSONエディタ" apps/next-smoke/.next/server/pages/legacy.html
          grep -q "master on the server: JSON editor, sequence_setting, PRODUCT, function" apps/next-smoke/.next/server/app/index.html
